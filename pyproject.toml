[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "npc-dialogue-generator"
version = "0.9.3"
description = "Desktop authoring tool for AI character and NPC dialogue trees."
readme = "CONTRIBUTING.md"
requires-python = ">=3.10"
authors = [{ name = "npc-dialogue-generator maintainers" }]
dependencies = [
    "PySide6==6.7.2",
    "ruamel.yaml==0.18.6",
    "pydantic==2.8.2",
    "httpx==0.27.0",
    "numpy==1.26.4",
    "rich==13.7.1",
    "typer==0.12.3",
]

[project.optional-dependencies]
dev = ["pytest==8.2.2", "pytest-qt==4.4.0", "ruff==0.5.5", "mypy==1.11.0"]

[project.scripts]
npcdg = "npcdg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
python_version = "3.11"
packages = ["npcdg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"